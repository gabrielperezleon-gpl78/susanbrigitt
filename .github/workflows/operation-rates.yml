name: Purchase and sale rate checks

on:
  pull_request:
    paths:
      - 'app/Http/Controllers/PurchaseController.php'
      - 'app/Http/Controllers/SaleController.php'
      - 'resources/views/purchases/**'
      - 'resources/views/sales/**'
      - 'resources/views/partials/operation-payment.blade.php'
      - 'database/migrations/**'
      - 'tests/Feature/UsdOperationWithoutRateTest.php'
      - '.github/workflows/operation-rates.yml'

jobs:
  operation-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test --filter=UsdOperationWithoutRateTest
